<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily English</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1a1a1a;--dim:#6b6b6b;--accent:#2d6a4f;--mark:#ffe08a;--hard:#e63946}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.4rem;margin:0 0 4px}h2{font-size:1.15rem;margin:32px 0 8px}
.meta{color:var(--dim);font-size:.85rem;margin-bottom:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
button{border:1px solid var(--accent);background:var(--card);color:var(--accent);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.9rem}
button:hover{background:var(--accent);color:#fff}
select{padding:6px;border-radius:6px;border:1px solid #ccc}
.article{background:var(--card);padding:20px 24px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:1.05rem}
.article w{cursor:pointer;border-radius:3px;padding:0 1px}
.article w.on{background:var(--mark);border-bottom:2px solid var(--hard)}
.article w.sel{background:var(--accent);color:#fff}
.sent{transition:background .3s}.sent.active{background:#eef6f0}
.notes{background:#eef6f0;padding:14px 18px;border-radius:8px;font-size:.95rem;margin-top:12px}
.notes b{color:var(--accent)}
#vocab{position:fixed;right:16px;bottom:16px;background:var(--card);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:12px 16px;max-width:260px;max-height:45vh;overflow:auto;font-size:.88rem}
#vocab h3{margin:0 0 6px;font-size:.95rem}
#vocab ul{margin:0;padding-left:18px}
#vocab li{cursor:pointer;color:var(--hard)}
@media(max-width:600px){#vocab{left:12px;right:12px;max-width:none;bottom:12px;max-height:38vh}}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Daily English</h1>
<div class="meta">点词标记不认识 → 收进生词本（右下角）。点击生词本里的词可取消标记。</div>
<div id="app"></div>
</div>
<div id="vocab" class="hidden"><h3>生词本 <button onclick="syncNow()" id="syncBtn" style="padding:2px 8px;font-size:.75rem">同步</button> <button onclick="exportVocab()" style="padding:2px 8px;font-size:.75rem">导出</button> <button onclick="showToken()" style="padding:2px 8px;font-size:.75rem">🔑</button></h3><ul id="vlist"></ul><div id="vhint" style="color:var(--dim);font-size:.78rem;margin-top:6px">点词入本 · 词组：连点多个词，再点一次确认</div></div>
<div id="tokbox" class="hidden" style="position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:var(--card);border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.2);padding:14px 16px;max-width:340px;width:90%;font-size:.85rem;z-index:9">
<b>GitHub 同步设置</b>（fine-grained token，仅授权 english-daily 仓库 Contents 读写）
<textarea id="tokin" style="width:100%;height:60px;margin:8px 0;font-size:.75rem" placeholder="粘贴 token（github_pat_...）"></textarea>
<div style="display:flex;gap:8px"><button onclick="saveToken()" style="flex:1">保存</button><button onclick="clearToken()" style="flex:1">清除</button><button onclick="document.getElementById('tokbox').classList.add('hidden')">关闭</button></div>
<div id="tokstat" style="color:var(--dim);margin-top:6px;font-size:.78rem"></div></div>
<script src="articles.js"></script>
<script>
const A=window.ARTICLES;
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let marks=store.get('vocab'),sentEls=[],sentTexts=[],selState=null;
function esc(s){return s.replace(/&/g,'&').replace(/</g,'<')}
function render(){
  const app=document.getElementById('app');
  A.forEach((a,i)=>{
    const d=document.createElement('div');
    d.innerHTML=`<h2>${i+1}. ${esc(a.title)}</h2><div class="meta">${esc(a.date)} · ${esc(a.level)}</div>`;
    const box=document.createElement('div');box.className='article';
    const p=document.createElement('p');
    a.sentences.forEach((s,j)=>{const sp=document.createElement('span');sp.className='sent';sp.dataset.i=i+'-'+j;
      sp.innerHTML=s.split(/\s+/).map(w=>`<w data-w="${esc(w.replace(/[.,!?;:"()']/g,''))}">${esc(w)}</w>`).join(' ');
      p.appendChild(sp);p.appendChild(document.createTextNode(' '));sentEls.push(sp);sentTexts.push(s)});
    box.appendChild(p);
    if(a.notes&&a.notes.length){const n=document.createElement('div');n.className='notes';n.innerHTML='<b>语法点</b><br>'+a.notes.map(x=>'· '+esc(x)).join('<br>');box.appendChild(n)}
    d.appendChild(box);app.appendChild(d);
  });
  document.addEventListener('click',e=>{
    const w=e.target.closest('w');if(!w)return;
    const k=w.dataset.w;
    if(selState){ // 词组选择中
      if(k===selState.key){ // 再点一次确认 → 以当前已选词拼接成词组
        const phrase=selState.words.join(' ');
        if(phrase&&!marks[phrase]){marks[phrase]=1;speak(phrase,0.9);store.set('vocab',marks);renderVocab();restoreMarks()}
        else{alert('生词本已有：'+phrase)}
        selState=null;document.querySelectorAll('w.sel').forEach(x=>x.classList.remove('sel'));return}
      // 检查连续性：必须是已选词的紧邻后继
      const prev=selState.words[selState.words.length-1];
      const seq=selState.seq;const nextW=seq[selState.idx+1];
      if(nextW&&nextW.dataset.w===k){selState.words.push(k);selState.idx++;w.classList.add('sel');speak(k,0.95);return}
      // 点了不连续的词或重复词 → 重新开始
      document.querySelectorAll('w.sel').forEach(x=>x.classList.remove('sel'));
      if(k===prev){selState=null;return}
      selState={key:k,words:[k],idx:seq.indexOf(w),seq:seq};w.classList.add('sel');speak(k,0.9);return}
    if(marks[k]){delete marks[k];w.classList.remove('on')}
    else{selState={key:k,words:[k],idx:[...w.closest('.sent').querySelectorAll('w')].indexOf(w),seq:[...w.closest('.sent').querySelectorAll('w')]};w.classList.add('sel');speak(k,0.9)}
    store.set('vocab',marks);renderVocab();
  });
  A.forEach((a,i)=>a.sentences.forEach((s,j)=>{const key=a.date+i+'-'+j;if(store.get('marks')[key]){} }));
  renderVocab();restoreMarks();
}
function restoreMarks(){document.querySelectorAll('w').forEach(w=>{if(marks[w.dataset.w])w.classList.add('on')});}
function renderVocab(){const ks=Object.keys(marks);document.getElementById('vocab').classList.toggle('hidden',!ks.length);
  document.getElementById('vlist').innerHTML=ks.map(k=>`<li data-k="${esc(k)}">${esc(k)}</li>`).join('');
  document.querySelectorAll('#vlist li').forEach(li=>li.onclick=()=>{delete marks[li.dataset.k];store.set('vocab',marks);
    document.querySelectorAll('w').forEach(w=>{if(w.dataset.w===li.dataset.k)w.classList.remove('on')});renderVocab()})}
function exportVocab(){const t=Object.keys(marks).join(', ');navigator.clipboard&&navigator.clipboard.writeText(t);alert('已复制生词：\n'+t)}
// ===== GitHub 同步 =====
const REPO_OWNER='qianzhu123',REPO_NAME='english-daily',VOCAB_PATH='data/vocab.json';
function getToken(){return localStorage.getItem('gh_token')||''}
function saveToken(){const t=document.getElementById('tokin').value.trim();if(t)localStorage.setItem('gh_token',t);
document.getElementById('tokstat').textContent=t?'已保存（仅存本机浏览器）':'未填写';syncNow()}
function clearToken(){localStorage.removeItem('gh_token');document.getElementById('tokin').value='';document.getElementById('tokstat').textContent='已清除'}
function showToken(){const b=document.getElementById('tokbox');b.classList.toggle('hidden');document.getElementById('tokin').value=getToken();
document.getElementById('tokstat').textContent=getToken()?'已配置：保存后点同步即可上传':'未配置：无 token 时只显示本机生词'}
async function ghGet(){ // 读云端 data/vocab.json
  const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${VOCAB_PATH}`,{cache:'no-store'});
  if(r.status===404)return{sha:null,data:{}};
  if(!r.ok)throw new Error('GitHub 读取失败 '+r.status);
  const j=await r.json();
  return{sha:j.sha,data:JSON.parse(atob(j.content.replace(/\s/g,'')))}}
async function ghPut(obj,sha){ // 写回并保留每日备份
  const token=getToken();if(!token)throw new Error('未配置 token');
  const files={[VOCAB_PATH]:{content:btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2))))}};
  const today=new Date().toISOString().slice(0,10);
  files['backups/vocab-'+today+'.json']={content:btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2))))}; // 每日快照
  const r=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${VOCAB_PATH}`,{method:'PUT',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({message:'vocab sync '+today+' ('+Object.keys(obj).length+' items)',content:files[VOCAB_PATH].content,
      ...(sha?{sha}:{})})});
  if(!r.ok)throw new Error('GitHub 写入失败 '+r.status+' '+(await r.text()).slice(0,120));
  return (await r.json()).content.sha}
function mergeSets(a,b){const o={...a};for(const k in b)o[k]=(o[k]||0)+ (b[k]||0);return o} // 取并集，计数相加
let syncing=false;
async function syncNow(){
  if(syncing)return;syncing=true;
  const btn=document.getElementById('syncBtn');if(btn)btn.textContent='…';
  try{
    const remote=await ghGet();
    if(getToken()){
      const merged=mergeSets(remote.data,marks);
      const changed=JSON.stringify(merged)!==JSON.stringify(remote.data)||JSON.stringify(merged)!==JSON.stringify(marks);
      if(changed){const sha=await ghPut(merged,remote.sha);Object.keys(merged).forEach(k=>{});marks=merged;store.set('vocab',marks)}
      else{marks=merged;store.set('vocab',marks)}
      document.getElementById('tokstat').textContent='✓ 已同步 '+Object.keys(marks).length+' 条（'+today+'）';
    }else{
      // 无 token：只读模式，合并云端进来
      const merged=mergeSets(remote.data,marks);marks=merged;store.set('vocab',marks);
      document.getElementById('tokstat').textContent='只读模式：已拉取云端 '+Object.keys(remote.data).length+' 条（配置 token 可上传）';
    }
    document.querySelectorAll('w').forEach(w=>w.classList.remove('on'));restoreMarks();renderVocab();
  }catch(e){document.getElementById('tokstat').textContent='✗ '+e.message}
  syncing=false;if(btn)btn.textContent='同步'}
render();
function speak(text,rate){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||parseFloat(document.getElementById('rate').value);u.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function playAll(){speechSynthesis.cancel();let i=0;
  const next=()=>{if(i>=sentTexts.length)return;sentEls.forEach(e=>e.classList.remove('active'));
    const el=sentEls[i];el&&el.classList.add('active');el&&el.scrollIntoView({block:'center',behavior:'smooth'});
    const u=new SpeechSynthesisUtterance(sentTexts[i]);u.lang='en-US';u.rate=parseFloat(document.getElementById('rate').value);
    u.onend=()=>{i++;next()};speechSynthesis.speak(u)};next()}
function stopAll(){speechSynthesis.cancel();sentEls.forEach(e=>e.classList.remove('active'))}
render();
// 打开页面即自动同步（无 token 时为只读拉取）
syncNow().catch(()=>{});
</script>
</body>
</html>
