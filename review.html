<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Daily English</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1a1a1a;--dim:#6b6b6b;--accent:#2d6a4f;--bad:#e63946;--mark:#ffe08a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.4rem;margin:0 0 2px}
.meta{color:var(--dim);font-size:.85rem;margin-bottom:16px}
a.back{color:var(--accent);text-decoration:none;font-size:.9rem}
.dayh{font-size:1.05rem;font-weight:700;margin:26px 0 8px;display:flex;align-items:center;gap:10px}
.dayh .tag{font-size:.72rem;background:#eef6f0;color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:400}
.wl{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:4px 18px}
.wrow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px dashed #e5e5e0;flex-wrap:wrap}
.wrow:first-child{border-top:none}
.wrow .w{font-family:Georgia,serif;font-weight:600;color:var(--bad);cursor:pointer;min-width:110px}
.wrow .w.today{color:var(--ink)}
.wrow .tr{color:var(--ink);font-size:.92rem;flex:1;min-width:160px}
.wrow .tr.blank{color:#ccc;font-size:.85rem}
.wrow .peek{font-size:.72rem;padding:1px 8px;white-space:nowrap}
.wrow .del{color:#bbb;cursor:pointer;padding:0 4px;font-size:1rem}
.wrow .del:hover{color:var(--bad)}
.empty{color:var(--dim);text-align:center;padding:30px 0}
/* 日期选择条 */
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.days button{border:1px solid #ccc;background:var(--card);color:var(--ink);padding:4px 12px;border-radius:16px;font-size:.82rem}
.days button.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.days button .n{color:inherit;opacity:.6;font-size:.75rem;margin-left:3px}
/* 语法点收藏区 */
#gramsec{margin-bottom:10px}
#gramsec .ghead{font-size:1.05rem;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:10px}
#gramsec .gl{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:10px 16px;margin-bottom:8px;font-size:.95rem}
#gramsec .gl .src{color:var(--dim);font-size:.78rem;margin-top:4px}
#gramsec .gl .rm{color:#bbb;cursor:pointer;float:right;padding:0 4px}
#gramsec .gl .rm:hover{color:var(--bad)}
/* 页面内 toast：替代原生 alert/confirm（长期规则） */
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;
padding:10px 20px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:80vw}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div class="wrap">
<h1>复习 <a class="back" href="index.html">← 返回阅读</a></h1>
<div class="meta">自由复习：生词按文章分组（配着课文过词）· 点词朗读 · 点「盖住」自测回忆，再点「显示」对答案 · 会了点 × 直接删除</div>
<div class="days" id="days"></div>
<div id="gramsec"></div>
<div id="history"></div>
</div>
<div id="toast"></div>
<script src="articles.js"></script>
<script>
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let marks=store.get('vocab');
const ART=window.ARTICLES||[]; // 按文章分组陈列（用户 10-31 定版：复习=对着读过的文章过词，不是对着操作日期）
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<')}
function cleanWord(s){return s.replace(/[.,!?;:"'()“”’]/g,'').toLowerCase().trim()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
// 旧数据兼容（无 day 字段的旧词条补日期）
(function(){let ch=false;const c={};const today=todayStr();
for(const k in marks){const ck=cleanWord(k)||k;let v=marks[k];
if(typeof v!=='object'||!v)v={n:Number(v)||1,day:/^\d{4}-\d{2}-\d{2}/.test(k)?k.slice(0,10):today};
if(!v.day){v.day=/^\d{4}-\d{2}-\d{2}/.test(k)?k.slice(0,10):today;ch=true}
if(c[ck])c[ck].n=Math.max(c[ck].n||1,v.n||1);else c[ck]=v;
if(ck!==k)ch=true}
if(ch){marks=c;store.set('vocab',marks)}})();
// ===== toast（禁原生弹窗长期规则） =====
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function speak(text,rate){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.9;u.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
// ===== 翻译（gtx 主源 + MyMemory 兜底 + 有效性过滤 + 人工义） =====
const TKEY='translations',TVER='v6';
function getTrans(){return store.get(TKEY+TVER)}
const MANUAL={article:'名词：冠词（语法）、文章、物品（an article of clothing 一件衣物）\n〔语境提示〕语法课上 article=a/an/the',properly:'副词：正确地、适当地、得体地（=correctly, in a proper way）',
clearance:'名词：放行许可（航空：waiting for clearance 等待塔台放行）；清关（海关）；净空',panicked:'动词：恐慌、惊慌失措（panic 的过去式）\n〔语境〕I panicked = 我慌了'};
function validTrans(t,k){if(!t)return false;if(!/[一-鿿A-Za-z0-9]/.test(t))return false;
if(t.toLowerCase()===k.toLowerCase())return false;if(/MYMEMORY WARNING|QUERY LENGTH|%s/.test(t))return false;return true}
function cleanSense(d){return d.split('；').map(g=>{const [pos,terms]=g.split('：');if(!terms)return g;
const keep=terms.split('、').filter(t=>t.length>=2||['他','她','它','在','有','的','了'].includes(t));
return keep.length?pos+'：'+keep.join('、'):''}).filter(Boolean).join('；')}
async function translate(k){const cache=getTrans();
if(MANUAL[k]){if(cache[k]!==MANUAL[k]){cache[k]=MANUAL[k];store.set(TKEY+TVER,cache)}return MANUAL[k]}
if(cache[k])return cache[k];
let t='';
try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&dt=bd&dj=1&q='+encodeURIComponent(k));
if(r.ok){const j=await r.json();
if(j.dict&&j.dict.length){const d=cleanSense(j.dict.map(d=>d.pos+'：'+d.terms.join('、')).join('；'));if(validTrans(d,k))t=d}
else if(j.sentences&&j.sentences[0]&&validTrans(j.sentences[0].trans,k))t=j.sentences[0].trans}}catch(e){}
if(!validTrans(t,k)){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|zh-CN');
const j=await r.json();let m=j&&j.responseData&&j.responseData.translatedText||'';
if(validTrans(m,k))t=m}catch(e){}}
if(validTrans(t,k)){const c=getTrans();c[k]=t;store.set(TKEY+TVER,c);return t}
return '（暂无释义）'}
// ===== 陈列与交互：按文章分组（词条自带 art 字段；无 art 的按首词回扫 articles.js 定位） =====
let dayFilter=null; // 保留变量兼容旧调用；null=全部
function wordHomeIdx(k){ // art 可信时优先；多篇命中按标记日期消歧（标记时文章才存在）
  const e=marks[k];
  const first=k.split(' ')[0].toLowerCase();
  const cands=[];
  for(let i=0;i<ART.length;i++){
    const text=ART[i].sentences.join(' ').toLowerCase();
    let p=text.indexOf(first);
    while(p>=0){
      const b=p===0?true:/[^a-z0-9]/.test(text[p-1]);
      const a2=p+first.length>=text.length?true:/[^a-z0-9]/.test(text[p+first.length]);
      if(b&&a2){cands.push(i);break}
      p=text.indexOf(first,p+1)}}
  if(!cands.length)return ART.length-1;
  if(cands.length===1)return cands[0];
  // 多篇命中：按标记日期消歧——date<=标记日 里最新一篇（标记时它才存在）；art 坏值不可信
  const day=e&&typeof e==='object'?e.day:null;
  if(day){
    const dated=cands.map(i=>({i,date:ART[i].date})).filter(x=>x.date<=day).sort((x,y)=>y.date.localeCompare(x.date));
    if(dated.length)return dated[0].i}
  return cands[0]}
function render(){
  const byArt=Array.from({length:ART.length},()=>[]);
  const loose=[]; // 归不了文章的兜底组
  Object.keys(marks).forEach(k=>{
    const i=wordHomeIdx(k);
    if(ART[i])byArt[i].push(k);else loose.push(k)});
  byArt.forEach(ws=>ws.sort((a,b)=>((marks[a]&&marks[a].seq)||0)-((marks[b]&&marks[b].seq)||0)));
  // 文章选择条（只列有词的文章）
  const today=todayStr();
  const arts=ART.map((a,i)=>({a,i,ws:byArt[i]})).filter(x=>x.ws.length);
  document.getElementById('days').innerHTML=
    `<button class="${dayFilter===null?'act':''}" onclick="setDay(null)">全部<span class="n">${Object.keys(marks).length}</span></button>`+
    arts.map(x=>`<button class="${dayFilter===x.i?'act':''}" onclick="setDay(${x.i})">${esc(x.a.title.replace(/ \(B1\)$/,''))}<span class="n">${x.ws.length}</span></button>`).join('')
    +(loose.length?`<button class="${dayFilter==='loose'?'act':''}" onclick="setDay('loose')">其他<span class="n">${loose.length}</span></button>`:'');
  const showArts=dayFilter===null?arts:(dayFilter==='loose'?[]:arts.filter(x=>x.i===dayFilter));
  let html=showArts.map(x=>{
    const ws=x.ws;
    const meta=esc(x.a.date)+' · '+esc(x.a.level||'');
    return `<div class="dayh">${esc(x.a.title)} <span class="tag">${ws.length} 词</span><span style="color:var(--dim);font-size:.75rem;font-weight:400">${meta}</span></div>
    <div class="wl">${ws.map(k=>rowHtml(k)).join('')}</div>`}).join('');
  if(dayFilter==='loose'||loose.length&&(dayFilter===null))
    html+=`<div class="dayh">其他 <span class="tag">${loose.length} 词</span></div><div class="wl">${loose.map(k=>rowHtml(k)).join('')}</div>`;
  document.getElementById('history').innerHTML=html||'<div class="empty">还没有生词。去阅读页点词加入。</div>';
  // 补翻译
  Object.keys(marks).forEach(k=>{if(!getTrans()[k])translate(k).then(()=>renderQuiet())})}
function rowHtml(k){
  const id='tr-'+k.replace(/[^a-z0-9]/gi,'_');
  const e=marks[k]||{};
  const dtag=e.day&&e.day!==todayStr()?`<span style="color:#bbb;font-size:.68rem">${e.day.slice(5)} </span>`:'';
  return `<div class="wrow"><span class="w" onclick="speak('${esc(k).replace(/'/g,"\\'")}')">${esc(k)}</span>
  <span class="tr" id="${id}">${getTrans()[k]?esc(getTrans()[k]):'<i style=color:#bbb>查译中…</i>'}</span>${dtag}
  <button class="peek" data-peek="${esc(k)}" onclick="peek('${esc(k).replace(/'/g,"\\'")}')">盖住</button>
  <span class="del" onclick="delWord('${esc(k).replace(/'/g,"\\'")}')" title="会了，删除">×</span></div>`}
function setDay(d){dayFilter=d;render()}
// ===== 语法点收藏区 =====
function gramDB(){return store.get('grammar')}
function renderGram(){
  const db=gramDB();const ks=Object.keys(db);
  const el=document.getElementById('gramsec');
  if(!ks.length){el.innerHTML='';return}
  el.innerHTML='<div class="ghead">⭐ 收藏的语法点 <span class="tag" style="font-size:.72rem;background:#eef6f0;color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:400">'+ks.length+' 条</span></div>'+
    ks.map(gid=>`<div class="gl"><span class="rm" data-gid="${esc(gid)}" title="取消收藏">×</span>${esc(db[gid].text||gid)}<div class="src">来自：${esc(db[gid].title||'')} · ${esc(db[gid].date||'')}</div></div>`).join('');
  el.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const db2=gramDB();delete db2[b.dataset.gid];store.set('grammar',db2);renderGram()})}
let hTimer=null;function renderQuiet(){clearTimeout(hTimer);hTimer=setTimeout(render,400)}
// 单词级自测：盖住/显示该词自己的翻译，反复切换
function peek(k){
  const id='tr-'+k.replace(/[^a-z0-9]/gi,'_');const el=document.getElementById(id);if(!el)return;
  const btn=document.querySelector(`button[data-peek="${CSS.escape(k)}"]`);
  const covered=el.dataset.covered==='1';
  if(covered){ // 当前盖着 → 显示答案
    el.textContent=getTrans()[k]||'（暂无释义）';el.classList.remove('blank');el.dataset.covered='';
    if(btn)btn.textContent='盖住';
  }else{ // 显示着 → 盖住（自测回忆）
    el.textContent='· · ·';el.classList.add('blank');el.dataset.covered='1';
    if(btn)btn.textContent='显示';
    speak(k,0.9)}}
function delWord(k){ // 自由复习：会了直接删，无确认弹窗（禁原生弹窗规则）
  delete marks[k];store.set('vocab',marks);render();toast('已删除「'+k+'」')}
render();
renderGram();
</script>
</body>
</html>
