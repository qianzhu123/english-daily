  if(!r.ok)return '';
  const j=await r.json();
  if(dt==='t')return j.sentences?j.sentences.map(s=>s.trans||'').join(''):'';
  return j&&j.dict&&j.dict.length?j:(j&&j.sentences&&j.sentences[0]?j:null)
}catch(e){return ''}}
async function tryBackup(q){ // 备用链路：Google 移动版接口 + Lingva（Cloudflare 反代，无需 key）
  try{const r=await fetch('https://translate.googleapis.com/translate_a/one?client=one&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(q));
  if(r.ok){const j=await r.json();
  if(j&&j.sentences&&j.sentences[0]&&j.sentences[0].trans)return j.sentences.map(s=>s.trans||'').join('')}}catch(e){}
  try{const r=await fetch('https://lingva.ml/api/v1/en/zh/'+encodeURIComponent(q));
  if(r.ok){const j=await r.json();
  if(j&&j.translation)return j.translation}}catch(e){}
  return ''}
function sceneSense(m,artIdx){ // 场景义挑选：词条归属文章命中场景义项则用之，否则 any
  if(typeof artIdx!=='number'||!ART[artIdx])return m.any;
  const hit=(m.art||[]).find(x=>ART[artIdx].title.includes(x.t));
  return hit?hit.v:m.any}
async function translate(k){const cache=getTrans();
const e=marks[k]||{};
if(MANUAL[k]){const m=MANUAL[k];const v=(typeof m==='object'&&m.art)?sceneSense(m,e.art):m;
  if(cache[k]!==v){cache[k]=v;store.set(TKEY+TVER,cache)}return v}
if(cache[k])return cache[k];
// 义项过滤需要语境：从词条归属文章里找回该词所在的句子（index.html 是标记时直接传，这里补齐同款行为）
let ctx='';
if(Number.isInteger(e.art)&&ART[e.art]){const first=k.split(' ')[0].toLowerCase();
  ctx=ART[e.art].sentences.find(s=>s.toLowerCase().includes(first))||''}
let t='';
if(ctx){ // 场景义优先（用户 11-12 定版：复习也展示句子里的意思，不印全义项）
  try{let cs=await tryGtx(ctx,'t');if(!cs)cs=await tryBackup(ctx);
    if(validTrans(cs,ctx))t='〔语境〕'+cs}catch(e2){}}
if(!t)try{const j=await tryGtx(k,'bd');
if(j&&j.dict){ // 语境句也翻译一下，用于挑出与语义相符的义项
  let ctxT='';if(ctx){try{ctxT=await tryGtx(ctx,'t')||await tryBackup(ctx)}catch(e2){}}
  let d=cleanSense(j.dict.map(d=>d.pos+'：'+d.terms.join('、')).join('；'));
  if(ctxT&&validTrans(ctxT,ctx)){const norm=t=>t.replace(/[的地了着]$/,''); // 义项词带"的/地"后缀，译文是裸词——去尾再比
    const hit=d.split('；').filter(g=>(g.split('：')[1]||'').split('、').some(term=>term&&ctxT.indexOf(norm(term))>=0));
    if(hit.length)d=hit.join('；')} // 全没命中就保留全部（宁多勿错杀）
  if(validTrans(d,k))t=d}
else if(j&&j.sentences&&j.sentences[0]&&validTrans(j.sentences[0].trans,k))t=j.sentences[0].trans}catch(e){}
if(!t){const s=await tryBackup(k);if(validTrans(s,k))t=s}
if(!validTrans(t,k)){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|zh-CN');
const j=await r.json();let m=j&&j.responseData&&j.responseData.translatedText||'';
if(validTrans(m,k))t=m}catch(e){}}
if(validTrans(t,k)){const c=getTrans();c[k]=t;store.set(TKEY+TVER,c);return t}
return '（暂无释义）'}
function cleanSense(d){return d.split('；').map(g=>{const [pos,terms]=g.split('：');if(!terms)return g;
const keep=terms.split('、').filter(t=>t.length>=2||['他','她','它','在','有','的','了'].includes(t));
return keep.length?pos+'：'+keep.join('、'):''}).filter(Boolean).join('；')}
// ===== 陈列与交互：按文章分组（词条自带 art 字段；无 art 的按首词回扫 articles.js 定位） =====
let dayFilter=null; // 保留变量兼容旧调用；null=全部
function wordHomeIdx(k){ // art 可信时优先（标记时写入的原索引，十一起就是对的）；验证不过才回扫重猜
  const e=marks[k];
  const first=k.split(' ')[0].toLowerCase();
  const cands=[];
  for(let i=0;i<ART.length;i++){
    const text=ART[i].sentences.join(' ').toLowerCase();
    let p=text.indexOf(first);
    while(p>=0){
      const b=p===0?true:/[^a-z0-9]/.test(text[p-1]);
      const a2=p+first.length>=text.length?true:/[^a-z0-9]/.test(text[p+first.length]);
      if(b&&a2){cands.push(i);break}
      p=text.indexOf(first,p+1)}}
  if(!cands.length)return ART.length-1;
  if(cands.length===1)return cands[0];
  // 多篇命中：先信词条自带的 art（要求 art 文章确含该词，防旧坏值）；跨午夜标记 day 会变"明天"，
  // 按日期猜会把词判给新批次同词文章（trick/checkout 误归 11-02 事故根因）——日期消歧只做最后兜底
  if(e&&typeof e==='object'&&Number.isInteger(e.art)&&ART[e.art]&&cands.includes(e.art))return e.art;
  const day=e&&typeof e==='object'?e.day:null;
  if(day){
    const dated=cands.map(i=>({i,date:ART[i].date})).filter(x=>x.date<=day).sort((x,y)=>y.date.localeCompare(x.date));
    if(dated.length)return dated[0].i}
  return cands[0]}
function render(){
  const byArt=Array.from({length:ART.length},()=>[]);
  const loose=[]; // 归不了文章的兜底组
  Object.keys(marks).forEach(k=>{
    const i=wordHomeIdx(k);
    if(ART[i])byArt[i].push(k);else loose.push(k)});
  byArt.forEach(ws=>ws.sort((a,b)=>((marks[a]&&marks[a].seq)||0)-((marks[b]&&marks[b].seq)||0)));
  // 文章选择条（只列有词的文章）
  const today=todayStr();
  const arts=ART.map((a,i)=>({a,i,ws:byArt[i]})).filter(x=>x.ws.length);
  document.getElementById('days').innerHTML=
    `<button class="${dayFilter===null?'act':''}" onclick="setDay(null)">全部<span class="n">${Object.keys(marks).length}</span></button>`+
    arts.map(x=>`<button class="${dayFilter===x.i?'act':''}" onclick="setDay(${x.i})">${esc(x.a.title.replace(/ \(B1\)$/,''))}<span class="n">${x.ws.length}</span></button>`).join('')
    +(loose.length?`<button class="${dayFilter==='loose'?'act':''}" onclick="setDay('loose')">其他<span class="n">${loose.length}</span></button>`:'');
  const showArts=dayFilter===null?arts:(dayFilter==='loose'?[]:arts.filter(x=>x.i===dayFilter));
  let html=showArts.map(x=>{
    const ws=x.ws;
    const meta=esc(x.a.date)+' · '+esc(x.a.level||'');
    return `<div class="dayh">${esc(x.a.title)} <span class="tag">${ws.length} 词</span><span style="color:var(--dim);font-size:.75rem;font-weight:400">${meta}</span></div>
    <div class="wl">${ws.map(k=>rowHtml(k)).join('')}</div>`}).join('');
  if(dayFilter==='loose'||loose.length&&(dayFilter===null))
    html+=`<div class="dayh">其他 <span class="tag">${loose.length} 词</span></div><div class="wl">${loose.map(k=>rowHtml(k)).join('')}</div>`;
  document.getElementById('history').innerHTML=html||'<div class="empty">还没有生词。去阅读页点词加入。</div>';
  // 补翻译
  Object.keys(marks).forEach(k=>{if(!getTrans()[k])translate(k).then(()=>renderQuiet())})}
function rowHtml(k){
  const id='tr-'+k.replace(/[^a-z0-9]/gi,'_');
  const e=marks[k]||{};
  const dtag=e.day&&e.day!==todayStr()?`<span style="color:#bbb;font-size:.68rem">${e.day.slice(5)} </span>`:'';
  return `<div class="wrow"><span class="w" onclick="speak('${esc(k).replace(/'/g,"\\'")}')">${esc(k)}</span>
  <span class="tr" id="${id}">${getTrans()[k]?esc(getTrans()[k]):'<i style=color:#bbb>查译中…</i>'}</span>${dtag}
  <button class="peek" data-peek="${esc(k)}" onclick="peek('${esc(k).replace(/'/g,"\\'")}')">盖住</button>
  <button class="peek" style="background:#eef6f0;color:var(--accent);border-color:#cfe3d6" onclick="toggleDetail('${esc(k).replace(/'/g,"\'")}')">详情</button>
  <span class="del" onclick="delWord('${esc(k).replace(/'/g,"\\'")}')" title="会了，删除">×</span>
  <div class="wdetail" id="dt-${id}" style="display:none;flex-basis:100%;background:#f7f7f2;border-radius:6px;padding:8px 12px;font-size:.88rem;color:var(--dim);line-height:1.7"></div></div>`}
function setDay(d){dayFilter=d;render()}

// 详情：展开该词所在完整句子（原文+整句翻译），点击反复开合
function toggleDetail(k){
  const e=marks[k]||{};const wid='tr-'+k.replace(/[^a-z0-9]/gi,'_');
  const el=document.getElementById('dt-'+wid);if(!el)return;
  if(el.style.display!=='none'){el.style.display='none';return}
  let sent='';if(Number.isInteger(e.art)&&ART[e.art]){const first=k.split(' ')[0].toLowerCase();
    sent=ART[e.art].sentences.find(s=>s.toLowerCase().includes(first))||''}
  if(!sent){el.innerHTML='（未找到该词的来源句子）';el.style.display='';return}
  el.innerHTML='<b style="color:var(--ink)">'+esc(sent)+'</b><span id="dtr-'+wid+'"> —— 整句翻译中…</span>';
  el.style.display='';
  const cache=getTrans();const ckey='ctx:'+k;
  if(cache[ckey]){const sp=document.getElementById('dtr-'+wid);if(sp)sp.innerHTML=esc(cache[ckey])}
  else{tryGtx(sent,'t').then(async cs=>{if(!cs)cs=await tryBackup(sent);
    if(validTrans(cs,sent)){const c=getTrans();c[ckey]=cs;store.set(TKEY+TVER,c);
      const sp=document.getElementById('dtr-'+wid);if(sp)sp.innerHTML='—— '+esc(cs)}
    else{const sp=document.getElementById('dtr-'+wid);if(sp)sp.innerHTML=''}})}}

// ===== 语法点收藏区 =====
function gramDB(){return store.get('grammar')}
function renderGram(){
  const db=gramDB();const ks=Object.keys(db);
  const el=document.getElementById('gramsec');
  if(!ks.length){el.innerHTML='';return}
  el.innerHTML='<div class="ghead">⭐ 收藏的语法点 <span class="tag" style="font-size:.72rem;background:#eef6f0;color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:400">'+ks.length+' 条</span></div>'+
    ks.map(gid=>`<div class="gl"><span class="rm" data-gid="${esc(gid)}" title="取消收藏">×</span>${esc(db[gid].text||gid)}<div class="src">来自：${esc(db[gid].title||'')} · ${esc(db[gid].date||'')}</div></div>`).join('');
  el.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const db2=gramDB();delete db2[b.dataset.gid];store.set('grammar',db2);renderGram()})}
let hTimer=null;function renderQuiet(){clearTimeout(hTimer);hTimer=setTimeout(render,400)}
// 单词级自测：盖住/显示该词自己的翻译，反复切换
function peek(k){
  const id='tr-'+k.replace(/[^a-z0-9]/gi,'_');const el=document.getElementById(id);if(!el)return;
  const btn=document.querySelector(`button[data-peek="${CSS.escape(k)}"]`);
  const covered=el.dataset.covered==='1';
  if(covered){ // 当前盖着 → 显示答案
    el.textContent=getTrans()[k]||'（暂无释义）';el.classList.remove('blank');el.dataset.covered='';
    if(btn)btn.textContent='盖住';
  }else{ // 显示着 → 盖住（自测回忆）
    el.textContent='· · ·';el.classList.add('blank');el.dataset.covered='1';
    if(btn)btn.textContent='显示';
    speak(k,0.9)}}
function delWord(k){ // 自由复习：会了直接删，无确认弹窗（禁原生弹窗规则）
  delete marks[k];store.set('vocab',marks);render();toast('已删除「'+k+'」')}
render();
renderGram();
</script>
