.opt{display:block;width:100%;text-align:left;border:1px solid #ddd;background:var(--card);border-radius:8px;padding:7px 12px;margin:6px 0;font-size:.9rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.good{background:#eef6f0;border-color:var(--accent);font-weight:700}
.opt.badv{background:#fdf0f0;border-color:var(--bad)}
.opt.picked{background:#eef3fb;border-color:#4a7bd0;border-width:2px;font-weight:700;box-shadow:0 0 0 2px rgba(74,123,208,.25)}

#content w.tadded{background:#ffe08a}
#content w.fraged{background:#ffd9a0;border-bottom:2px solid #e8963c}

.qdone{font-size:.78rem;font-weight:700;margin-top:4px}

@media (max-width:1100px){.vocabside{display:none}}

    if(!t2){ // 穿过父容器找下一个词元素（训练页 passage 无 .sent 包裹）
      const par=nn.parentElement;let up=par;
      while(up&&!up.nextSibling)up=up.parentElement;
      nn=up?(up.nextSibling?null:null):null;break}
    nn=t2;break}
  // 简化：直接对比两词在 document 里的位置——nextElementSibling 链不可靠时用整体顺序
  if(!cont){
    const all=[...document.querySelectorAll('#content w[data-w], .vocabside w[data-w]')];
    const i1=all.indexOf(tsel.wEl),i2=all.indexOf(el);
    if(i2===i1+1)cont=true}
  if(cont){tsel.words.push(k);tsel.wEl=el;el.classList.add('sel');speak(k,0.95);return}
  // 不连续 → 句子片段：收集首词→末词之间所有词（DOM 顺序）
  tConfirmFragment(el,k)}
function tConfirmPhrase(){
  const phrase=tsel.words.join(' ');tselClear();
  const marks=store.get(TVKEY);
  if(phrase&&!marks[phrase]){
    marks[phrase]={n:1,day:studyDay(),art:-1,due:studyDay(),ease:1,lapses:0,phrase:true};
    store.set(TVKEY,marks);speak(phrase,0.9);
    toast('词组已收进：'+phrase);
    trainTranslate(phrase)}}
function tConfirmFragment(elEnd,kEnd){
  const all=[...document.querySelectorAll('#content w[data-w], .vocabside w[data-w]')];
  const i1=all.indexOf(tsel.w1El),i2=all.indexOf(elEnd);
  const w1=tsel.w1El,w2=elEnd;tselClear();
  if(i2<i1){toast('请按阅读顺序选词');return}
  const frag=all.slice(i1,i2+1).map(x=>x.textContent).join(' ');
  const fdb=store.get('trainfrags');
  const day=curDay||TRAIN[0].day;
  const hit=fdb[day]&&fdb[day].find(x=>x.sent===frag);
  if(hit){fdb[day]=fdb[day].filter(x=>x.sent!==frag);toast('已取消该片段')}
  else{fdb[day]=fdb[day]||[];fdb[day].push({sent:frag,day:studyDay()});toast('⭐ 已画句子片段（首词到末词），复习页可看')}
  store.set('trainfrags',fdb)}

function tClick(k,el){ // 训练页点词统一入口（用户 11-21：单词/词组/片段同流程）
  const marks=store.get(TVKEY);
  if(tsel){tselAdd(k,el);return} // 选词进行中
  if(marks[k]){tselAdd(k,el);return} // 已在生词本的词再点=开始选词
  addTrainWord(k,el)}
// 渲染后把已在生词本的训练词着色（刷新/重渲染后保持黄底）
function markTrainWords(){
  const marks=store.get(TVKEY);
  document.querySelectorAll('#content w[data-w], .vocabside w[data-w]').forEach(w=>{
    if(marks[w.dataset.w]){w.style.background='#ffe08a';w.classList.add('tadded')}
    else{w.style.background='';w.classList.remove('tadded')}})
  // 句子片段高亮（trainfrags 记录首末词，按 DOM 顺序标 fraged）
  const fdb=store.get('trainfrags');
  const day=curDay||TRAIN[0].day;
  (fdb[day]||[]).forEach(fr=>{
    const frw=fr.sent.split(/\s+/).map(x=>x.toLowerCase().replace(/[^a-z0-9à-ɏ'’-]/g,''));
    const aws=[...document.querySelectorAll('#content w[data-w]')];
    for(let i=0;i<=aws.length-frw.length;i++){
      let m=true;
      for(let j=0;j<frw.length;j++){if((aws[i+j].dataset.w||'')!==frw[j]){m=false;break}}
      if(m){for(let j=0;j<frw.length;j++)aws[i+j].classList.add('fraged');i+=frw.length-1}}})}

// 题组：按原文聚合（同一 passage 的题共享一段原文，只贴一次）
function buildQuizGroups(d,saved){
  const groups=[];
  d.quiz.forEach((qz,qn)=>{
    const last=groups[groups.length-1];
    if(last&&last.passage===qz.passage)last.items.push(qn);
    else groups.push({passage:qz.passage,items:[qn]})});
  return '<div class="card"><h2>📝 雅思练一练 <span class="tag">选选项 → 提交判分</span></h2>'+
    groups.map((g,gi)=>'<div style="margin-top:14px;padding-top:10px;border-top:1px dashed #ddd">'+
      '<div class="passage">'+g.passage.split(/\s+/).map(w2tok).join(' ')+' <span style="color:var(--dim);font-size:.7rem">（点生词加入复习）</span></div>'+
      g.items.map(qn=>quizHtml(d.day,qn,d.quiz[qn],saved,true)).join('')+'</div>').join('')+'</div>'}
function quizHtml(day,qn,qz,saved,noPassage){
  const key=day+'#q'+qn;
  const done=saved[key];
  // 提交制（用户 11-20）：点选项只选中，点「提交」才判分
  const picked=quizPick[key];
  const opts=qz.opts.map((o,i)=>{
    let cls='opt';
    if(done){ // 已提交：锁定，标出对错
      if(i===qz.ans)cls+=' good';
      else if(i===done.pick)cls+=' badv'}
    else if(picked===i)cls+=' picked';
    return `<button class="${cls}" ${done?'disabled':''} onclick="pickOpt('${day}',${qn},${i},event)">${'ABCD'[i]}. ${esc(o)}</button>`}).join('');
  const submit=!done?`<button class="reveal" style="margin:8px 0" ${picked===undefined?'disabled':''} onclick="answerQuiz('${day}',${qn})">提交</button>`:'';
  const res=done?`<div class="qdone ${done.ok?'ok':'no'}">${done.ok?'✓ 答对了':'✗ 答错了——正确答案：'+'ABCD'[qz.ans]}</div>`:'';
  return `<div style="margin-top:14px"><div style="font-size:.72rem;color:var(--dim)">${esc(qz.type)}</div>
  ${noPassage?'':`<div class="passage">${qz.passage.split(/\s+/).map(w2tok).join(' ')} <span style="color:var(--dim);font-size:.7rem">（点生词加入复习）</span></div>`}
  <p style="font-weight:700;margin:6px 0">${esc(qz.q)}</p>${opts}${submit}${res}
  <div class="qwhy ${done?'show':''}" id="why-${qn}">💡 ${esc(qz.why)}</div></div>`}
const quizPick={}; // 未提交的临时选择 {day#qn: idx}
function pickOpt(day,qn,i,ev){quizPick[day+'#q'+qn]=i;
  // 只更新本题按钮样式，不整页重渲染（用户 11-23：点击无反馈的根因是 render 重建丢状态）
  if(!ev)return;
  const card=ev.target.closest('div');
  (card||document).querySelectorAll('button.opt').forEach(b=>b.classList.remove('picked'));
  ev.target.classList.add('picked');
  const submitBtn=card?card.querySelector('button.reveal'):null;
  if(submitBtn)submitBtn.disabled=false}
function answerQuiz(day,qn){
  const picked=quizPick[day+'#q'+qn];
  if(picked===undefined){toast('先选一个选项再提交');return}
  const d=TRAIN.find(x=>x.day===day);const qz=d.quiz[qn];
  const ok=picked===qz.ans;
  const saved=store.get('traintry');
  saved[day+'#q'+qn]={pick:picked,ok:ok};store.set('traintry',saved);
  delete quizPick[day+'#q'+qn];
  render();
  const why=document.getElementById('why-'+qn);if(why)why.classList.add('show')}// ===== 训练页侧栏生词本（用户 11-18：训练页也要能看到生词本）=====
function escT(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function renderVocabSide(){ // 训练页独立生词库 vocab-train（与阅读分开）
  const el=document.getElementById('vocaside-list');if(!el)return;
  const marks=store.get(TVKEY);const ks=Object.keys(marks);
  const tc=store.get('translations-train');
  const tday=curDay||TRAIN[0].day;
  const fdb=store.get('trainfrags');
  const fragHtml=(fdb[tday]||[]).map((f,fi)=>'<li style="display:block"><span style="color:#c77b2f;font-size:.78rem">⭐ '+escT(f.sent.length>50?f.sent.slice(0,50)+'…':f.sent)+'</span><span class="del" onclick="delTrainFrag('+fi+')" title="移除">×</span></li>').join('');
  if(!ks.length&&!fragHtml){el.innerHTML='<li style="color:var(--dim);font-size:.8rem">还没有生词——点文章/训练里的生词即可加入</li>';return}
  if(!ks.length&&fragHtml){el.innerHTML=fragHtml;return}
  el.innerHTML=fragHtml+ks.slice(-40).reverse().map(k=>{const q=k.replace(/'/g,"\'").replace(/"/g,'&quot;');
    return `<li><span class="w" onclick="speak('${q}',0.9)">${escT(k)}</span><span class="del" onclick="delVocabSide('${q}')" title="移除">×</span><span class="tr">${tc[k]?escT(tc[k]):'<span style="color:var(--dim)">查译…</span>'}</span></li>`}).join('');
}
function delTrainFrag(fi){const day=curDay||TRAIN[0].day;const fdb=store.get('trainfrags');
  (fdb[day]||[]).splice(fi,1);store.set('trainfrags',fdb);renderVocabSide();markTrainWords();toast('片段已移除')}
function delVocabSide(k){const marks=store.get(TVKEY);delete marks[k];store.set(TVKEY,marks);
  // 同步清掉页面上的黄底标记（用户 11-23：删了侧栏词文章里还亮着）
  document.querySelectorAll('w[data-w]').forEach(w=>{if(w.dataset.w===k){w.style.background='';w.classList.remove('tadded')}});
  renderVocabSide();markTrainWords();toast('「'+k+'」已移除')}
document.addEventListener('DOMContentLoaded',renderVocabSide);
function saveTry(day,n){ // 输入框失焦即存：编辑后不点对答案也不丢
  const ta=document.getElementById('try-'+n);if(!ta)return;
  const v=ta.value.trim();
  const saved=store.get('traintry');
  if(v&&v!==(saved[day+'#'+n]||'')){saved[day+'#'+n]=v;store.set('traintry',saved)}}
function reveal(day,n){
  const d=TRAIN.find(x=>x.day===day);const it=d.items[n];
  const ans=document.getElementById('ans-'+n);const ta=document.getElementById('try-'+n);const fb=document.getElementById('fb-'+n);
  if(ans.style.display==='block'){ans.style.display='none';return}
  // 提取压力：没写不给看（用户定版：直接给内容填=没意义）
  if(!ta.value.trim()){toast('先写一句（写错没关系），再对答案');fb.className='fb no';fb.textContent='先写，再看';return}
  ans.style.display='block';
  saveTry(day,n); // 点对答案时也保存当前版本（但不覆盖更新的失焦保存——同一内容幂等）
  fb.className='fb ok';fb.textContent='✓ 已记录你的作答——Claude 下次会话批改';
}
render();
</script>
