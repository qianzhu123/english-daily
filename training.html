<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training · Daily English</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1a1a1a;--dim:#6b6b6b;--accent:#2d6a4f;--bad:#e63946;--mark:#ffe08a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.4rem;margin:0 0 2px}
.meta{color:var(--dim);font-size:.85rem;margin-bottom:16px}
a.back{color:var(--accent);text-decoration:none;font-size:.9rem}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:16px 20px;margin-bottom:14px}
.card h2{font-size:1.02rem;margin:0 0 8px;color:var(--accent)}
.card .tag{font-size:.7rem;background:#eef6f0;color:var(--accent);padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
.card p{margin:6px 0;font-size:.95rem}
.frames{background:#eef6f0;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:.92rem}
.frames b{color:var(--accent)}
.frames div{padding:2px 0}
.answer{background:#f4f0e4;border-left:3px solid #c9a227;border-radius:6px;padding:10px 14px;margin-top:10px;font-size:.92rem;display:none;white-space:pre-line}
.answer b{color:#8a6d00}
.reveal{margin-top:10px;padding:4px 12px;font-size:.8rem}
.speak{border:none;background:none;cursor:pointer;font-size:1rem;padding:0 4px}
.try{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:.92rem;font-family:inherit;margin-top:8px;resize:vertical;min-height:56px}
.fb{font-size:.85rem;margin-top:6px}
.fb.ok{color:var(--accent)}.fb.no{color:var(--bad)}
/* 顶部导航 */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.nav button{border:1px solid #ccc;background:var(--card);color:var(--ink);padding:4px 12px;border-radius:16px;font-size:.82rem;cursor:pointer}
.nav button.act{background:var(--accent);color:#fff;border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:80vw}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div class="wrap">
<h1>训练 <a class="back" href="index.html">← 返回阅读</a></h1>
<div class="meta">每题自带「句式卡」——要用的英文框架直接印在题里，不需要翻回文章。先照着框架填空/翻译，写完再对答案</div>
<div class="nav" id="nav"></div>
<div id="content"></div>
</div>
<div id="toast"></div>
<script>
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ===== 每日训练内容（由 Claude 更新；key=日期，新的在上）=====
// 2026-11-03 改版：用户反馈"对话训练难度过大+文章已归档没法参照"→ 全部题目自带句式卡，难度降为填空/照框架翻译
const TRAIN=[
{
  day:'2026-11-03',
  title:'酒店投诉 · 降级版（照框架填空）',
  brief:'剧情接着上次的：你半夜投诉空调坏了，前台说客满。今天的题全部自带句式卡——不用记文章，照着框架填词就行。填对一个算一个，写完点「对答案」。',
  items:[
    {kind:'填空',
     q:'你想争取明天换房。句式卡：<b>Is there any chance of ___ (move) to another room tomorrow?</b><br>照框架把句子补完整（提示：any chance of 后面的动词要变形）。',
     ref:'Is there any chance of moving to another room tomorrow?\n（of 是介词，后面动词加 -ing：of moving。这是本题唯一的考点）'},
    {kind:'填空',
     q:'你还要争取今晚部分退款。句式卡：<b>Could you at least offer ___ ___ for tonight?</b><br>两个空：「部分的」「退款」= partial refund（文章和训练里都出现过）。',
     ref:'Could you at least offer a partial refund for tonight?\n（a partial refund = 部分退款；refund 动词名词同形）'},
    {kind:'选择',
     q:'前台说送你免费早餐打发你。你想表达「早餐解决不了问题，我要的是睡觉」。三句选一句最合适的：\nA. Breakfast is bad. I want to eat.\nB. Thank you, but breakfast doesn\'t solve the problem — I need sleep, not food.\nC. I don\'t like breakfast. Give me a room.',
     ref:'选 B。\nA/C 是中式直译，生气但没说服力；B 先谢后拒绝（Thank you, but...），再说清诉求（I need sleep）——礼貌但坚定，酒店反而更容易让步。'},
    {kind:'翻译',
     q:'句式卡：<b>This is a bit more than I expected — is there any chance of a discount?</b><br>把这句翻成中文，体会它为什么比 "Give me a discount!" 有效。',
     ref:'「这比我预想的贵一点——有没有可能打个折？」\n有效在两点：①a bit / any chance 都是软化词，对方不丢面子；②说"比我预想的"是描述事实，不是攻击对方。谈判里对事不对人，成功率更高。'}
  ]
},
{
  day:'2026-11-02',
  title:'酒店投诉 · 谈判回合（原版，偏难）',
  brief:'这天的题偏难，做不完没关系——11-03 的降级版已覆盖同样的句式，先做新版。',
  items:[
    {kind:'对话',
     q:'前台："I\'m afraid the hotel is fully booked tonight." 用英文回应，争取明天换房或今晚部分退款。',
     ref:'Is there any chance of moving me to another room tomorrow? And could you at least offer a partial refund for tonight?'},
    {kind:'对话',
     q:'前台送免费早餐打发你。英文拒绝并坚持诉求。',
     ref:'Thank you, but breakfast doesn\'t solve the problem — I need sleep, not food.'},
    {kind:'句式',
     q:'谈判三连翻译：①这比我预想的贵一点，能打折吗 ②那免费早餐或延迟退房呢 ③谢谢，我考虑一下。',
     ref:'① This is a bit more than I expected — is there any chance of a discount?\n② What about a free breakfast, or a late checkout?\n③ Thank you anyway, I\'ll think about it.'},
    {kind:'回考',
     q:'旧错误：①我点了牛排你端来三文鱼（两句）②买单怎么问？',
     ref:'① I ordered the steak, but you brought me the salmon. Could you bring me the right one?\n② Can I have the check, please?'}
  ]
}];
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<')}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function speak(text,rate){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.9;u.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
let curDay=null;
function render(){
  document.getElementById('nav').innerHTML=TRAIN.map((d,i)=>`<button class="${(curDay||TRAIN[0].day)===d.day?'act':''}" onclick="pick('${d.day}')">${d.day.slice(5)} ${d.title.replace(' · ','·').slice(0,12)}</button>`).join('');
  const d=TRAIN.find(x=>x.day===(curDay||TRAIN[0].day))||TRAIN[0];
  const saved=store.get('traintry');
  document.getElementById('content').innerHTML=`
  <div class="card"><h2>${esc(d.title)}<span class="tag">${d.day}</span></h2><p style="color:var(--dim)">${esc(d.brief)}</p></div>`+
  d.items.map((it,n)=>{
    const key=d.day+'#'+n;const mine=saved[key]||'';
    return `<div class="card"><h2>${esc(it.kind)}<span class="tag">#${n+1}</span> <button class="speak" onclick="speak(this.dataset.q)" data-q="${esc(it.q).replace(/"/g,'"')}" title="朗读">🔊</button></h2>
    <p>${esc(it.q).replace(/\n/g,'<br>')}</p>
    <textarea class="try" id="try-${n}" placeholder="照着句式卡写英文……">${esc(mine)}</textarea>
    <div class="fb" id="fb-${n}"></div>
    <button class="reveal" onclick="reveal('${d.day}',${n})">对答案</button>
    <div class="answer" id="ans-${n}"><b>参考（不是唯一答案，意思和句式对就算过）</b>
${esc(it.ref)}</div></div>`}).join('');
}
function pick(day){curDay=day;render()}
function reveal(day,n){
  const d=TRAIN.find(x=>x.day===day);const it=d.items[n];
  const ans=document.getElementById('ans-'+n);const ta=document.getElementById('try-'+n);const fb=document.getElementById('fb-'+n);
  if(ans.style.display==='block'){ans.style.display='none';return}
  ans.style.display='block';
  const saved=store.get('traintry');saved[day+'#'+n]=ta.value.trim();store.set('traintry',saved);
  if(ta.value.trim()){fb.className='fb ok';fb.textContent='✓ 已记录你的作答（'+ta.value.trim().split(/\s+/).length+' 词）——Claude 下次会话批改'}
  else{fb.className='fb no';fb.textContent='下次先写一句再对答案，输出才有提取压力'}
  speak(it.ref.replace(/①|②|③/g,''),0.9);
}
render();
</script>
</body>
</html>
