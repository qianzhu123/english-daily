<script>

const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let marks=store.get('vocab');
const ART=window.ARTICLES||[]; // 按文章分组陈列（用户 10-31 定版：复习=对着读过的文章过词，不是对着操作日期）
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<')}
function cleanWord(s){return s.replace(/[.,!?;:"'()“”’]/g,'').toLowerCase().trim()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function studyDay(){const d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
// 旧数据兼容（无 day 字段的旧词条补日期）
(function(){let ch=false;const c={};const today=todayStr();
for(const k in marks){const ck=cleanWord(k)||k;let v=marks[k];
if(typeof v!=='object'||!v)v={n:Number(v)||1,day:/^\d{4}-\d{2}-\d{2}/.test(k)?k.slice(0,10):today};
if(!v.day){v.day=/^\d{4}-\d{2}-\d{2}/.test(k)?k.slice(0,10):today;ch=true}
if(c[ck])c[ck].n=Math.max(c[ck].n||1,v.n||1);else c[ck]=v;
if(ck!==k)ch=true}
if(ch){marks=c;store.set('vocab',marks)}})();
// ===== toast（禁原生弹窗长期规则） =====
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function speak(text,rate){const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.9;u.voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
// ===== 翻译（gtx 主源 + MyMemory 兜底 + 有效性过滤 + 人工义） =====
const TKEY='translations',TVER='v16';
function getTrans(){let c=store.get(TKEY+TVER);
  if(!Object.keys(c).length){ // 新版本缓存为空：迁入旧版本缓存（坏翻译已由 MANUAL 覆盖 + v13 起的过滤器清洗），免去全量重查
    const prev=store.get(TKEY+'v13');if(Object.keys(prev).length){store.set(TKEY+TVER,prev);return prev}}
  return c}

function validTrans(t,k){if(!t)return false;if(!/[一-鿿A-Za-z0-9]/.test(t))return false;
if(/^[：:，,。;；\s]/.test(t))return false; // 残缺符号开头的碎片（hundred→"：一百"事故）
if(t.toLowerCase()===k.toLowerCase())return false;if(/MYMEMORY WARNING|QUERY LENGTH|%s|ALL AVAILABLE FREE TRANSLATIONS/i.test(t))return false;return true}
async function tryGtx(q,dt){try{

  if(!r.ok)return '';
  const j=await r.json();
  if(dt==='t')return j.sentences?j.sentences.map(s=>s.trans||'').join(''):'';
  return j&&j.dict&&j.dict.length?j:(j&&j.sentences&&j.sentences[0]?j:null)
}catch(e){return ''}}
async function tryBackup(q){ // 备用链路：Google 移动版接口 + Lingva（Cloudflare 反代，无需 key）
  try{const r=await fetch('https://translate.googleapis.com/translate_a/one?client=one&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(q));
  if(r.ok){const j=await r.json();
  if(j&&j.sentences&&j.sentences[0]&&j.sentences[0].trans)return j.sentences.map(s=>s.trans||'').join('')}}catch(e){}
  try{const r=await fetch('https://lingva.ml/api/v1/en/zh/'+encodeURIComponent(q));
  if(r.ok){const j=await r.json();
  if(j&&j.translation)return j.translation}}catch(e){}
  return ''}

function cleanSense(d){return d.split('；').map(g=>{const [pos,terms]=g.split('：');if(!terms)return g;
const keep=terms.split('、').filter(t=>t.length>=2||['他','她','它','在','有','的','了'].includes(t));
return keep.length?pos+'：'+keep.join('、'):''}).filter(Boolean).join('；')}

function wordHomeIdx(k){ // art 可信时优先（标记时写入的原索引，十一起就是对的）；验证不过才回扫重猜
  const e=marks[k];
  const first=k.split(' ')[0].toLowerCase();
  const cands=[];
  for(let i=0;i<ART.length;i++){
    const text=ART[i].sentences.join(' ').toLowerCase();
    let p=text.indexOf(first);
    while(p>=0){
      const b=p===0?true:/[^a-z0-9]/.test(text[p-1]);
      const a2=p+first.length>=text.length?true:/[^a-z0-9]/.test(text[p+first.length]);
      if(b&&a2){cands.push(i);break}
      p=text.indexOf(first,p+1)}}
  if(!cands.length)return ART.length-1;
  if(cands.length===1)return cands[0];
  // 多篇命中：先信词条自带的 art（要求 art 文章确含该词，防旧坏值）；跨午夜标记 day 会变"明天"，
  // 按日期猜会把词判给新批次同词文章（trick/checkout 误归 11-02 事故根因）——日期消歧只做最后兜底
  if(e&&typeof e==='object'&&Number.isInteger(e.art)&&ART[e.art]&&cands.includes(e.art))return e.art;
  const day=e&&typeof e==='object'?e.day:null;
  if(day){
    const dated=cands.map(i=>({i,date:ART[i].date})).filter(x=>x.date<=day).sort((x,y)=>y.date.localeCompare(x.date));
    if(dated.length)return dated[0].i}
  return cands[0]}

  const [y,mth]=view.ym.split('-').map(Number);
  const first=new Date(y,mth-1,1);
  const startDow=first.getDay(); // 0=日
  const daysIn=new Date(y,mth,0).getDate();
  const today=studyDay();
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="calcell dim"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds=y+'-'+String(mth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const e=db[ds];
    const n=e?(e.words.length+e.grams.length):0;
    cells+=`<button class="calcell${e?' has':''}${ds===today?' today':''}" data-d="${ds}" ${e?'':'disabled'}>${d}${e?`<span class="cnt">${n}</span>`:''}</button>`}
  const ymName=y+' 年 '+mth+' 月';
  return `<div class="cal"><div class="calhead"><button class="calnav" data-nav="-1">‹ 上月</button><b>${ymName}</b><button class="calnav" data-nav="1">下月 ›</button></div>
  <div class="calgrid"><div class="caldow">日</div><div class="caldow">一</div><div class="caldow">二</div><div class="caldow">三</div><div class="caldow">四</div><div class="caldow">五</div><div class="caldow">六</div>${cells}</div></div>
  <div style="color:var(--dim);font-size:.85rem">共 ${Object.keys(db).length} 天有学习记录 · 高亮日期可点入</div>`}
function wireCal(db){
  document.querySelectorAll('.calnav').forEach(b=>b.onclick=()=>{
    const [y,m]=view.ym.split('-').map(Number);
    const d2=new Date(y,m-1+Number(b.dataset.nav),1);
    view.ym=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0');render()});
  document.querySelectorAll('.calcell.has').forEach(b=>b.onclick=()=>gotoDay(b.dataset.d))}
function dayHtml(db){ // 单日:按文章分组——单词→词组→句子片段→语法→完整文章（含原始标记）
  const d=view.day;const e=db[d]||{words:[],grams:[],frags:[],byArt:{}};
  const g=gramDB();
  // 当日文章（按发布日期归属，用户 11-20）
  const artIdxs=new Set();
  const done=doneDB();
  Object.keys(done).forEach(t=>{if(done[t]&&done[t].date===d){const i2=ART.findIndex(a=>a.title===t);if(i2>=0)artIdxs.add(i2)}});
  e.grams.forEach(gid=>{const t=(g[gid].title||'');const i2=ART.findIndex(a=>a.title===t);if(i2>=0)artIdxs.add(i2)});
  (e.frags||[]).forEach(x=>artIdxs.add(x.ai));
  Object.keys(e.byArt||{}).forEach(k=>{if(k!=='loose')artIdxs.add(Number(k))});
  const arts=[...artIdxs].map(i2=>Number(i2)).filter(i2=>ART[i2]).sort((a,b)=>(ART[a].date||'')<(ART[b].date||'')?-1:1);
  let html=`<div class="dayhead"><a class="backcal" href="#" onclick="backCal();return false">← 日历</a><b>${d}</b><span class="tag">${e.words.length} 词 · ${(e.frags||[]).length} 片段 · ${e.grams.length} 语法</span></div>`;
  // 词组与单词分列：词组=key 含空格（用户 11-20 展示顺序：第一篇单词→词组→句子→语法→全文，再下一篇）
  if(arts.length===0&&(e.words.length)){
    const loose=(e.byArt.loose||[]);
    if(loose.length)html+=`<div class="dayh">其他 <span class="tag">${loose.length} 词</span></div><div class="wl">${loose.sort((a,b)=>((marks[a]&&marks[a].seq)||0)-((marks[b]&&marks[b].seq)||0)).map(k=>rowHtml(k)).join('')}</div>`}
  for(const ai of arts){
    const a=ART[ai];
    const ks=(e.byArt[ai]||[]).slice().sort((x,y)=>((marks[x]&&marks[x].seq)||0)-((marks[y]&&marks[y].seq)||0));
    const words=ks.filter(k=>!k.includes(' '));
    const phrases=ks.filter(k=>k.includes(' '));
    const frags=(e.frags||[]).filter(x=>x.ai===ai);
    const grams=e.grams.filter(gid=>g[gid].title===a.title);
    html+=`<div class="dayh">${esc(a.title)} <span class="tag">${esc(a.date)} · ${esc(a.level||'')}</span></div>`;
    if(words.length)html+=`<div class="wl">${words.map(k=>rowHtml(k)).join('')}</div>`;
    if(phrases.length)html+=`<div class="dayh" style="font-size:.85rem">词组 <span class="tag">${phrases.length}</span></div><div class="wl">${phrases.map(k=>rowHtml(k)).join('')}</div>`;
    if(frags.length){
      html+=`<div class="dayh" style="font-size:.85rem">✏️ 重点片段 <span class="tag">${frags.length}</span></div>`+
        frags.map((x,xi)=>{const gi='uktr-'+x.ai+'-'+xi;
          return `<div class="gcard"><span class="rm" data-ukai="${x.ai}" data-ukxi="${xi}" style="float:right;cursor:pointer;color:var(--bad,#c0392b);font-size:1.05rem" title="删除该片段">×</span><b>${esc(x.sent)}</b><div class="src" id="${gi}"> —— 翻译中…</div></div>`}).join('');
      frags.forEach((x,xi)=>{const id='uktr-'+x.ai+'-'+xi;
        setTimeout(()=>{const sp=document.getElementById(id);if(!sp)return;
          translateFrag(x.sent).then(tr=>{if(tr)sp.textContent='—— '+tr;else sp.textContent=''}).catch(()=>sp.textContent='')},0)})}
    if(grams.length){
      html+=`<div class="dayh" style="font-size:.85rem">⭐ 语法点 <span class="tag">${grams.length}</span></div>`+
        grams.map(gid=>`<div class="gcard"><span class="rm" data-gid="${esc(gid)}" style="float:right;cursor:pointer;color:var(--bad)" title="取消收藏">×</span>${esc(g[gid].text||gid)}</div>`).join('')}
    // 完整文章：重现阅读页的原始标记（生词高亮 + 片段高亮）
    const markWords=new Set(words.concat(phrases));
    const fragByJ={};frags.forEach(x=>{(fragByJ[x.j]=fragByJ[x.j]||[]).push(x)});
    html+=`<div class="dayh" style="font-size:.85rem">📄 完整文章 <span class="tag">含你的原始标记</span></div><div class="artfull">`;
    html+=a.sentences.map((sent,j)=>{
      let marked=sent.split(/\s+/).map(tok=>{
        const m2=tok.match(/^([^A-Za-z0-9À-ɏ]*)([A-Za-z0-9À-ɏ'’-]+)([\s\S]*)$/);
        if(!m2)return esc(tok);
        const cw=m2[2].toLowerCase();
        const cls=markWords.has(cw)?' on':'';
        return esc(m2[1])+'<w class="'+cls.trim()+'">'+esc(m2[2])+'</w>'+esc(m2[3])}).join(' ');
      (fragByJ[j]||[]).forEach(x=>{
        const toks=sent.split(/\s+/);const joined=toks.join(' ');
        const start=joined.indexOf(x.sent);if(start<0)return;
        const before=joined.slice(0,start);
        const n0=before.trim()?before.trim().split(/\s+/).length:0;
        const n1=n0+x.sent.split(/\s+/).length;
        // 片段高亮：在 marked 字符串上按词序包 fragon（重新分词一遍）
        let wi2=0;
        marked=marked.replace(/<w class="( on)?">([\s\S]*?)<\/w>/g,(mm,cls2,txt)=>{
          const inFrag=wi2>=n0&&wi2<n1;wi2++;
          return '<w class="'+(inFrag?'fragon':(cls2||'').trim())+'">'+txt+'</w>'})});
      return '<p style="margin:4px 0">'+marked+'</p>'}).join('');
    html+=`</div>`;
  }
  if(!e.words.length&&!e.grams.length&&!(e.frags||[]).length)html+='<div class="empty">这一天没有学习记录。</div>';
  return html}function wireDay(){
  document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const db2=gramDB();delete db2[b.dataset.gid];store.set('grammar',db2);render();toast('已取消收藏')})}
window.onpopstate=()=>{const d=parsePath();if(d){view.mode='day';view.day=d;render()}else{view.mode='cal';render()}};
function rowHtml(k){
  const id='tr-'+k.replace(/[^a-z0-9]/gi,'_');
  const e=marks[k]||{};
  const ai2=wordHomeIdx(k);const pub=(ART[ai2]&&ART[ai2].date)||e.day||'';
  const dtag=pub?`<span style="color:#bbb;font-size:.68rem">${pub.slice(5)} </span>`:'';
  return `<div class="wrow"><span class="w" onclick="speak('${esc(k).replace(/'/g,"\\'")}')">${esc(k)}</span>
  <span class="tr" id="${id}">${getTrans()[k]?esc(getTrans()[k]):'<i style=color:#bbb>查译中…</i>'}</span>${dtag}
  <button class="peek" data-peek="${esc(k)}" onclick="peek('${esc(k).replace(/'/g,"\\'")}')">盖住</button>
  <button class="peek" style="background:#eef6f0;color:var(--accent);border-color:#cfe3d6" onclick="toggleDetail('${esc(k).replace(/'/g,"\'")}')">详情</button>
  <span class="del" onclick="delWord('${esc(k).replace(/'/g,"\\'")}')" title="会了，删除">×</span>
  <div class="wdetail" id="dt-${id}" style="display:none;flex-basis:100%;background:#f7f7f2;border-radius:6px;padding:8px 12px;font-size:.88rem;color:var(--dim);line-height:1.7"></div></div>`}
function setDay(d){dayFilter=d;render()}

// 详情：展开该词所在完整句子（原文+整句翻译），点击反复开合
function toggleDetail(k){
  const e=marks[k]||{};const wid='tr-'+k.replace(/[^a-z0-9]/gi,'_');
  const el=document.getElementById('dt-'+wid);if(!el)return;
  if(el.style.display!=='none'){el.style.display='none';return}
  let sent='';if(Number.isInteger(e.art)&&ART[e.art]){const first=k.split(' ')[0].toLowerCase();
    sent=ART[e.art].sentences.find(s=>s.toLowerCase().includes(first))||''}
  if(!sent){el.innerHTML='（未找到该词的来源句子）';el.style.display='';return}
  el.innerHTML='<b style="color:var(--ink)">'+esc(sent)+'</b><span id="dtr-'+wid+'"> —— 整句翻译中…</span>';
  el.style.display='';
  const cache=getTrans();const ckey='ctx:'+k;
  if(cache[ckey]){const sp=document.getElementById('dtr-'+wid);if(sp)sp.innerHTML=esc(cache[ckey])}
  else{tryGtx(sent,'t').then(async cs=>{if(!cs)cs=await tryBackup(sent);
    if(validTrans(cs,sent)){const c=getTrans();c[ckey]=cs;store.set(TKEY+TVER,c);
      const sp=document.getElementById('dtr-'+wid);if(sp)sp.innerHTML='—— '+esc(cs)}
    else{const sp=document.getElementById('dtr-'+wid);if(sp)sp.innerHTML=''}})}}

// ===== 语法点收藏区 =====
function gramDB(){return store.get('grammar')}
function renderGram(){
  const db=gramDB();const ks=Object.keys(db);
  const el=document.getElementById('gramsec');
  if(!ks.length){el.innerHTML='';return}
  el.innerHTML='<div class="ghead">⭐ 收藏的语法点 <span class="tag" style="font-size:.72rem;background:#eef6f0;color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:400">'+ks.length+' 条</span></div>'+
    ks.map(gid=>`<div class="gl"><span class="rm" data-gid="${esc(gid)}" title="取消收藏">×</span>${esc(db[gid].text||gid)}<div class="src">来自：${esc(db[gid].title||'')} · ${esc(db[gid].date||'')}</div></div>`).join('');
  el.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{const db2=gramDB();delete db2[b.dataset.gid];store.set('grammar',db2);renderGram()})}
let hTimer=null;function renderQuiet(){clearTimeout(hTimer);hTimer=setTimeout(render,400)}
// 单词级自测：盖住/显示该词自己的翻译，反复切换
function peek(k){
  const id='tr-'+k.replace(/[^a-z0-9]/gi,'_');const el=document.getElementById(id);if(!el)return;
  const btn=document.querySelector(`button[data-peek="${CSS.escape(k)}"]`);
  const covered=el.dataset.covered==='1';
  if(covered){ // 当前盖着 → 显示答案
    el.textContent=getTrans()[k]||'（暂无释义）';el.classList.remove('blank');el.dataset.covered='';
    if(btn)btn.textContent='盖住';
  }else{ // 显示着 → 盖住（自测回忆）
    el.textContent='· · ·';el.classList.add('blank');el.dataset.covered='1';
    if(btn)btn.textContent='显示';
    speak(k,0.9)}}
function delWord(k){ // 自由复习：会了直接删，无确认弹窗（禁原生弹窗规则）
  delete marks[k];store.set('vocab',marks);render();toast('已删除「'+k+'」')}
const _d0=parsePath();
if(_d0){view.mode='day';view.day=_d0}
render();

// （暂无释义）点一下=重查（清缓存后重新走三路翻译链）
document.addEventListener('click',async function(ev){
  const sp=ev.target.closest('span.tr');if(!sp)return;
  if(sp.textContent.indexOf('暂无释义')<0)return;
  const row=sp.closest('.wrow');if(!row)return;
  const wEl=row.querySelector('span.w');if(!wEl)return;
  const k=Array.from(Object.keys(marks)).find(function(x){return x===wEl.textContent})||wEl.textContent;
  const c=getTrans();if(c[k])delete c[k];
  sp.innerHTML='<i style=color:#bbb>重查中…</i>';
  try{await translate(k)}catch(e){}
  sp.textContent=getTrans()[k]||'（暂无释义）';
});
</script>
